name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Build Docker Image
      run: |
        docker build -t ${{ steps.echo-tag.outputs.tag }} .
        docker push ${{ steps.echo-tag.outputs.tag }}
      env:
        REGISTRY: ghcr.io
        IMAGE_NAME: ${{ github.repository }}
        TAG: ${{ github.sha
