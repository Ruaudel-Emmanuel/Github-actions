name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Build Docker Image
      run: |
        docker build -t ${{ steps.echo-tag.outputs.tag }} .
        docker push ${{ steps.echo-tag.outputs.tag }}
      env:
        REGISTRY: ghcr.io
        IMAGE_NAME: ${{ github.repository }}
        TAG: ${{ github.sha }}
      secrets:
        CR_PAT: ${{ secrets.CR_PAT }}
      id: echo-tag

    with:
      args: |
        --build-arg GITHUB_SHA=${GITHUB_SHA}
        --build-arg GITHUB_REF=refs/heads/${GITHUB_REF}
    - name: Publish to GitHub Container Registry
      run: echo "The Docker image has been pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
      env:
        REGISTRY: ghcr.io
        IMAGE_NAME: ${{ github.repository }}
        TAG: ${{ github.sha }}
      secrets:
        CR_PAT: ${{ secrets.CR_PAT }}
